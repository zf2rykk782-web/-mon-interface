<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finance Dashboard</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;background:#020421}
  body{color:#fff}
  button{font:inherit;border:0}

  .app{
    width:100%;
    max-width:945px;
    min-height:100vh;
    margin:0 auto;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 19%, rgba(42,78,255,.96) 0%, rgba(17,43,224,.98) 25%, rgba(6,24,143,.99) 49%, rgba(2,4,33,1) 79%),
      #020421;
  }

  .top{
    height:116px;
    padding:12px 38px 0;
    display:flex;
    align-items:flex-start;
    gap:18px;
  }

  .avatar{
    width:84px;height:84px;border-radius:50%;
    flex:0 0 84px;
    background:linear-gradient(145deg,#34363f,#11121a);
    display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:500;
    position:relative;
  }
  .avatar:after{
    content:"";
    position:absolute;
    width:14px;height:14px;border-radius:50%;
    background:#ff3030;
    top:-7px;right:-6px;
  }

  .search{
    height:84px;
    flex:1;
    max-width:560px;
    border-radius:44px;
    background:rgba(179,194,244,.63);
    display:flex;align-items:center;
    padding:0 32px;
    gap:28px;
    color:#f7f8ff;
    font-size:39px;
    letter-spacing:-1px;
  }
  .search-icon{
    width:38px;height:38px;border:5px solid white;border-radius:50%;
    position:relative;flex:0 0 auto;
  }
  .search-icon:after{
    content:"";position:absolute;width:21px;height:5px;
    background:white;border-radius:4px;right:-16px;bottom:-9px;
    transform:rotate(48deg);
  }

  .round-btn{
    width:84px;height:84px;border-radius:50%;
    background:rgba(179,194,244,.63);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 84px;
  }

  .chart-icon{width:47px;height:47px;display:flex;align-items:flex-end;gap:7px}
  .chart-icon span{width:11px;background:#fff;border-radius:8px}
  .chart-icon span:nth-child(1){height:25px}
  .chart-icon span:nth-child(2){height:42px}
  .chart-icon span:nth-child(3){height:34px}

  .card-icon{
    width:48px;height:34px;border:4px solid white;border-radius:7px;position:relative;
  }
  .card-icon:before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;background:white}
  .card-icon:after{content:"";position:absolute;left:8px;bottom:5px;width:15px;height:4px;background:white;border-radius:2px}

  .balance{
    text-align:center;
    margin-top:157px;
  }
  .personal{font-size:31px;line-height:1.1;margin-bottom:20px;letter-spacing:-.4px}
  .amount{
    font-size:101px;
    line-height:.98;
    font-weight:650;
    letter-spacing:-5px;
  }
  .amount .cents{
    font-size:50px;
    letter-spacing:-2px;
    vertical-align:baseline;
  }

  .accounts{
    display:inline-flex;
    align-items:center;justify-content:center;
    min-width:212px;height:86px;
    margin-top:34px;
    padding:0 35px;
    border-radius:45px;
    background:rgba(177,185,224,.55);
    font-size:35px;
    letter-spacing:-.8px;
  }

  .dots{
    display:flex;justify-content:center;gap:10px;
    margin-top:163px;
  }
  .dots span{width:13px;height:13px;border-radius:50%;background:#aeb5cf}
  .dots span:last-child{background:#fff}

  .actions{
    position:relative;
    width:100%;
    height:241px;
    margin:76px 0 0;
    display:block;
    background-image:url('actions-reference.jpg');
    background-position:center top;
    background-size:100% 241px;
    background-repeat:no-repeat;
  }
  .action{
    position:absolute;
    top:0;
    width:25%;
    height:100%;
    font-size:0;
    color:transparent;
  }
  .action:nth-child(1){left:0}
  .action:nth-child(2){left:25%}
  .action:nth-child(3){left:50%}
  .action:nth-child(4){left:75%}
  .action-circle{
    width:108px;height:108px;margin:0 auto 24px;
    border-radius:50%;
    background:rgba(166,173,204,.57);
    display:flex;align-items:center;justify-content:center;
  }
  .action-label,.action-circle{visibility:hidden}
  .action-label{font-size:31px;letter-spacing:-.8px;white-space:nowrap}

  .plus{
    width:45px;height:45px;position:relative;
  }
  .plus:before,.plus:after{content:"";position:absolute;background:white;border-radius:4px}
  .plus:before{width:45px;height:6px;left:0;top:20px}
  .plus:after{height:45px;width:6px;left:20px;top:0}

  .move-icon{width:53px;height:49px;position:relative}
  .move-icon:before,.move-icon:after{content:"";position:absolute;width:42px;height:6px;background:white;border-radius:5px}
  .move-icon:before{left:0;top:9px;transform:rotate(6deg)}
  .move-icon:after{right:0;bottom:9px;transform:rotate(-6deg)}
  .move-icon i,.move-icon b{position:absolute;width:16px;height:16px;border-top:6px solid white;border-right:6px solid white}
  .move-icon i{right:0;top:2px;transform:rotate(45deg)}
  .move-icon b{left:0;bottom:2px;transform:rotate(225deg)}

  .bank-icon{width:55px;height:49px;position:relative}
  .bank-icon:before{content:"";position:absolute;left:4px;right:4px;top:2px;border-left:27px solid transparent;border-right:27px solid transparent;border-bottom:17px solid white}
  .bank-icon:after{content:"";position:absolute;left:7px;right:7px;bottom:2px;height:25px;background:linear-gradient(to right,white 0 8px,transparent 8px 15px,white 15px 23px,transparent 23px 30px,white 30px 38px,transparent 38px 45px,white 45px 53px);border-bottom:6px solid white}
  .more-icon{display:flex;gap:7px}
  .more-icon span{width:12px;height:12px;background:white;border-radius:50%}

  .transactions{
    margin:38px 38px 0;
    background:rgba(28,29,53,.91);
    border-radius:38px;
    padding:31px 34px 30px;
    min-height:450px;
  }

  .transaction{
    display:grid;
    grid-template-columns:116px 1fr auto;
    align-items:center;
    column-gap:14px;
  }
  .flags{width:110px;height:100px;position:relative}
  .flags{width:110px;height:100px;position:relative}
  .flag{
    position:absolute;
    width:72px;
    height:72px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:none !important;
    border:0 !important;
    outline:0 !important;
    filter:none !important;
    object-fit:cover;
    display:block;
  }
  .canada-flag{left:0;top:0;z-index:2}
  .usa-flag{right:0;bottom:0;z-index:1}

  .tx-title{font-size:34px;letter-spacing:-1px;white-space:nowrap}
  .tx-date{font-size:30px;color:#a9a9bb;margin-top:10px;white-space:nowrap}
  .tx-values{text-align:right;align-self:center}
  .positive{font-size:34px;white-space:nowrap}
  .negative{font-size:30px;color:#a9a9bb;margin-top:12px;white-space:nowrap}

  .second-transaction{
    display:none;
  }

  .see-all{
    text-align:center;
    font-size:34px;
    margin-top:58px;
  }

  .products{
    margin:39px 38px 160px;
    height:190px;
    border-radius:38px 38px 0 0;
    background:rgba(28,29,53,.91);
    padding:39px 37px;
    font-size:31px;
    color:#b9b9c8;
  }
  .products span{color:#fff;font-size:34px;margin-left:7px}

  .bottom{
    position:fixed;
    z-index:10;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:min(945px,100%);
    height:163px;
    padding:0;
    background-image:url('bottom-reference.jpg');
    background-position:center bottom;
    background-size:100% 163px;
    background-repeat:no-repeat;
    display:block;
  }
  .nav-item{
    position:absolute;
    top:0;
    height:163px;
    width:20%;
    text-align:center;
    color:transparent;
    font-size:0;
  }
  .nav-item:nth-child(1){left:0}
  .nav-item:nth-child(2){left:20%}
  .nav-item:nth-child(3){left:40%}
  .nav-item:nth-child(4){left:60%}
  .nav-item:nth-child(5){left:80%}
  .nav-icon,.nav-label{visibility:hidden}
  .nav-icon{height:63px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .nav-label{font-size:26px}
  .home-r{font-size:55px;font-weight:700;line-height:1}
  .invest-icon{width:50px;height:54px;position:relative;border-bottom:5px solid #d9d9df}
  .invest-icon:before{content:"";position:absolute;left:2px;bottom:3px;width:9px;height:26px;background:#d9d9df;border-radius:7px;box-shadow:17px -10px 0 #d9d9df,34px -25px 0 #d9d9df}
  .invest-icon:after{content:"";position:absolute;left:3px;top:8px;width:38px;height:20px;border-top:5px solid #d9d9df;border-radius:50%;transform:rotate(-17deg)}
  .payments-icon{width:54px;height:45px;position:relative}
  .payments-icon:before,.payments-icon:after{content:"";position:absolute;width:36px;height:7px;background:#d9d9df;border-radius:5px}
  .payments-icon:before{top:8px;right:0}
  .payments-icon:after{bottom:8px;left:0}
  .payments-icon i,.payments-icon b{position:absolute;width:15px;height:15px;border-top:6px solid #d9d9df;border-right:6px solid #d9d9df}
  .payments-icon i{right:0;top:1px;transform:rotate(45deg)}
  .payments-icon b{left:0;bottom:1px;transform:rotate(225deg)}
  .crypto-icon{font-size:51px;font-weight:700;line-height:1}
  .life-icon{width:50px;height:50px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .life-icon span{border-radius:10px;background:#d9d9df}

  @media(max-width:700px){
    .top{height:82px;padding:8px 18px 0;gap:10px}
    .avatar{width:55px;height:55px;flex-basis:55px;font-size:29px}
    .avatar:after{width:9px;height:9px;top:-4px;right:-3px}
    .search{height:55px;padding:0 20px;gap:17px;font-size:25px}
    .search-icon{width:27px;height:27px;border-width:4px}
    .search-icon:after{width:14px;height:4px;right:-11px;bottom:-7px}
    .round-btn{width:55px;height:55px;flex-basis:55px}
    .chart-icon{transform:scale(.62)}
    .card-icon{transform:scale(.62)}
    .balance{margin-top:103px}
    .personal{font-size:21px;margin-bottom:14px}
    .amount{font-size:67px;letter-spacing:-3px}
    .amount .cents{font-size:32px}
    .accounts{height:59px;min-width:146px;font-size:24px;margin-top:23px}
    .dots{margin-top:110px;gap:7px}
    .dots span{width:8px;height:8px}
    .actions{
      width:100%;
      height:auto;
      aspect-ratio:945 / 241;
      margin:55px 0 0;
      background-size:100% 100%;
    }
    .action-circle{width:68px;height:68px;margin-bottom:15px}
    .action-label{font-size:20px}
    .plus{transform:scale(.62)}
    .move-icon{transform:scale(.62)}
    .bank-icon{transform:scale(.62)}
    .more-icon{transform:scale(.72)}
    .transactions{margin:29px 16px 0;border-radius:27px;padding:23px 22px 24px;min-height:300px}
    .transaction{grid-template-columns:82px 1fr auto;column-gap:7px}
    .flags{width:76px;height:72px}
    .flag{width:52px;height:52px;border:0;outline:0;box-shadow:none}
    .tx-title{font-size:22px}
    .tx-date{font-size:19px;margin-top:5px}
    .positive{font-size:22px}
    .negative{font-size:19px;margin-top:7px}
    .see-all{font-size:23px;margin-top:35px}
    .products{margin:28px 16px 130px;height:120px;border-radius:27px 27px 0 0;padding:26px;font-size:21px}
    .products span{font-size:23px}
    .bottom{
      height:auto;
      aspect-ratio:945 / 163;
      padding:0;
      background-size:100% 100%;
    }
    .nav-item{height:100%}
    .nav-icon{height:39px;margin-bottom:0}
    .nav-label{font-size:16px}
    .home-r{font-size:36px}
    .invest-icon{transform:scale(.67)}
    .payments-icon{transform:scale(.67)}
    .crypto-icon{font-size:35px}
    .life-icon{transform:scale(.67)}
  }

  @media(max-width:430px){
    .top{padding-left:12px;padding-right:12px}
    .search{padding-left:16px;padding-right:12px}
    .round-btn{display:flex}
    .balance{margin-top:100px}
    .actions{gap:2px;margin-left:10px;margin-right:10px}
    .action-label{font-size:18px}
    .transactions{padding-left:17px;padding-right:17px}
    .transaction{grid-template-columns:67px 1fr auto}
    .tx-title{font-size:19px}
    .tx-date{font-size:17px}
    .positive{font-size:18px}
    .negative{font-size:16px}
    .nav-label{font-size:14px}
  }

  /* Références fournies par l'utilisateur : ces deux images remplacent
     directement les deux zones correspondantes de l'interface. */
  .actions-reference{
    width:100%;
    display:block;
    margin:76px 0 0;
  }
  .actions-reference img{
    display:block;
    width:100%;
    height:auto;
    background:transparent;
  }
  .bottom-reference{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(945px,100%);
    line-height:0;
  }
  .bottom-reference img{
    display:block;
    width:100%;
    height:auto;
  }
  @media(max-width:700px){
    .actions-reference{margin-top:55px}
  }


  /* ===== RESPONSIVE : téléphone, tablette et ordinateur ===== */

  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:945px;
    min-height:100dvh;
  }

  /* Empêche les éléments du haut de sortir de l'écran */
  .top{
    width:100%;
  }

  .search{
    min-width:0;
  }

  .search span:last-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* Le montant s'adapte à la largeur disponible */
  .amount{
    font-size:clamp(48px, 10.7vw, 101px);
    letter-spacing:clamp(-3px, -.53vw, -5px);
  }

  .amount .cents{
    font-size:clamp(25px, 5.3vw, 50px);
  }

  .personal{
    font-size:clamp(17px, 3.3vw, 31px);
  }

  .accounts{
    height:clamp(52px, 9.1vw, 86px);
    min-width:clamp(140px, 22.4vw, 212px);
    font-size:clamp(22px, 3.7vw, 35px);
  }

  /* Carte transaction : ne laisse jamais le contenu dépasser */
  .transactions{
    width:calc(100% - 76px);
  }

  .transaction{
    min-width:0;
  }

  .transaction-info{
    min-width:0;
  }

  .tx-title,
  .tx-date{
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tx-values{
    min-width:0;
  }

  .positive,
  .negative{
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Les deux références restent proportionnelles */
  .actions-reference img,
  .bottom-reference img{
    max-width:100%;
    height:auto;
  }

  /* Tablettes / petits ordinateurs */
  @media (min-width:701px) and (max-width:1000px){
    .top{
      padding-left:clamp(20px,4vw,38px);
      padding-right:clamp(20px,4vw,38px);
    }

    .balance{
      margin-top:clamp(90px,16vw,157px);
    }

    .dots{
      margin-top:clamp(80px,17vw,163px);
    }

    .actions-reference{
      margin-top:clamp(45px,8vw,76px);
    }

    .transactions{
      margin-left:clamp(20px,4vw,38px);
      margin-right:clamp(20px,4vw,38px);
    }
  }

  /* Smartphones */
  @media (max-width:700px){
    .top{
      width:100%;
      padding-left:clamp(10px,4vw,18px);
      padding-right:clamp(10px,4vw,18px);
      gap:clamp(6px,2vw,10px);
    }

    .search{
      flex:1 1 auto;
      min-width:0;
    }

    .round-btn{
      flex:0 0 auto;
    }

    .balance{
      width:100%;
      padding:0 10px;
      margin-top:clamp(70px,24vw,103px);
    }

    .dots{
      margin-top:clamp(65px,25vw,110px);
    }

    .actions-reference{
      width:100%;
      margin-top:clamp(35px,13vw,55px);
      overflow:hidden;
    }

    .actions-reference img{
      width:100%;
      max-width:none;
    }

    .transactions{
      width:calc(100% - 32px);
      margin-left:16px;
      margin-right:16px;
    }

    .transaction{
      width:100%;
    }
  }

  /* Très petits smartphones */
  @media (max-width:380px){
    .top{
      padding-left:9px;
      padding-right:9px;
      gap:6px;
    }

    .avatar{
      width:48px;
      height:48px;
      flex-basis:48px;
      font-size:25px;
    }

    .search{
      height:48px;
      padding-left:13px;
      padding-right:10px;
      gap:13px;
      font-size:21px;
    }

    .search-icon{
      width:23px;
      height:23px;
      border-width:3px;
    }

    .round-btn{
      width:48px;
      height:48px;
      flex-basis:48px;
    }

    .transactions{
      width:calc(100% - 20px);
      margin-left:10px;
      margin-right:10px;
      padding-left:12px;
      padding-right:12px;
    }

    .transaction{
      grid-template-columns:58px minmax(0,1fr) auto;
      column-gap:5px;
    }

    .flags{
      width:58px;
      height:62px;
    }

    .flag{
      width:46px;
      height:46px;
    }

    .tx-title{
      font-size:17px;
    }

    .tx-date{
      font-size:15px;
    }

    .positive{
      font-size:16px;
    }

    .negative{
      font-size:14px;
    }

    .see-all{
      font-size:20px;
    }
  }

  /* Très grands écrans : la maquette reste centrée */
  @media (min-width:946px){
    .app{
      margin-left:auto;
      margin-right:auto;
    }
  }



  /* ===== PAGE DE CONNEXION ===== */
  #loginPage{
    min-height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(42,78,255,.96) 0%, rgba(17,43,224,.98) 27%, rgba(6,24,143,.99) 52%, rgba(2,4,33,1) 82%),
      #020421;
  }
  .login-box{
    width:min(430px,100%);
    padding:38px 30px 32px;
    border-radius:30px;
    background:rgba(28,29,53,.94);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .login-title{
    margin:0 0 8px;
    text-align:center;
    font-size:34px;
    font-weight:700;
  }
  .login-subtitle{
    margin:0 0 30px;
    text-align:center;
    color:#b9b9c8;
    font-size:16px;
  }
  .login-label{
    display:block;
    margin:0 0 8px;
    font-size:16px;
    color:#eee;
  }
  .login-input{
    width:100%;
    height:56px;
    margin-bottom:18px;
    padding:0 17px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    outline:none;
    background:rgba(255,255,255,.09);
    color:#fff;
    font-size:17px;
  }
  .login-input:focus{
    border-color:rgba(120,145,255,.9);
    background:rgba(255,255,255,.12);
  }
  .login-button{
    width:100%;
    height:56px;
    margin-top:6px;
    border-radius:16px;
    background:#fff;
    color:#07105e;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    border:0;
    display:block;
    text-align:center;
  }
  .login-error{
    min-height:20px;
    margin:0 0 10px;
    text-align:center;
    color:#ff9c9c;
    font-size:14px;
  }
  @media(max-width:430px){
    #loginPage{padding:16px}
    .login-box{padding:30px 22px 24px;border-radius:25px}
    .login-title{font-size:29px}
  }

</style>
</head>
<body>
<div id="loginPage">
  <div class="login-box" id="loginForm">
    <h1 class="login-title">Log in</h1>
    <p class="login-subtitle">Access your dashboard</p>

    <label class="login-label" for="loginIdentifier">User ID</label>
    <input class="login-input" id="loginIdentifier" type="text" autocomplete="off">

    <label class="login-label" for="loginPassword">Password</label>
    <input class="login-input" id="loginPassword" type="password" autocomplete="off">

    <div class="login-error" id="loginError"></div>
    <button class="login-button" type="button" id="loginButton">Log in</button>
  </div>
</div>

<div id="dashboardPage" style="display:none;">
<div class="app">

<script>
(function(){
  const VALID_IDENTIFIER = '4103164523';
  const VALID_PASSWORD = '773412';

  const loginPage = document.getElementById('loginPage');
  const dashboardPage = document.getElementById('dashboardPage');
  const identifier = document.getElementById('loginIdentifier');
  const password = document.getElementById('loginPassword');
  const error = document.getElementById('loginError');
  const button = document.getElementById('loginButton');

  function openDashboard(){
    if (identifier.value.trim() === VALID_IDENTIFIER &&
        password.value === VALID_PASSWORD) {
      error.textContent = '';
      loginPage.style.display = 'none';
      dashboardPage.style.display = 'block';
      window.scrollTo(0, 0);
    } else {
      error.textContent = 'Incorrect User ID or password.';
      password.value = '';
      password.focus();
    }
  }

  button.addEventListener('click', openDashboard);

  [identifier, password].forEach(function(field){
    field.addEventListener('keydown', function(e){
      if(e.key === 'Enter') openDashboard();
    });
  });
})();
</script>
